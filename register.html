<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AKANESHI</title>
    <meta name="description" content="Create your AKANESHI account to save wishlists, track orders, and manage your profile." />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a class="brand" href="/index.html">AKANESHI</a>
      </nav>
    </header>

    <main class="page-shell auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Create account</p>
        <h1>Register</h1>
        <form id="register-form" novalidate>
          <input type="text" name="name" placeholder="Full name" required />
          <input type="email" name="email" placeholder="Email address" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit" class="button full-width">Create account</button>
        </form>
        <p class="auth-link">Already a customer? <a href="/login.html">Log in</a></p>
      </section>
    </main>
  </body>
</html>
