<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | AKANESHI</title>
    <meta name="description" content="Secure administrator login for AKANESHI operations and storefront management." />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a class="brand" href="/index.html">AKANESHI</a>
      </nav>
    </header>

    <main class="page-shell auth-shell">
      <section class="auth-card admin-card">
        <p class="eyebrow">Protected access</p>
        <h1>Admin login</h1>
        <form id="admin-login-form" novalidate>
          <input type="text" name="username" placeholder="Username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit" class="button full-width">Enter dashboard</button>
        </form>
      </section>
    </main>
  </body>
</html>
