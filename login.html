<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AKANESHI</title>
    <meta name="description" content="Log in to AKANESHI to manage your account, wishlist, order history, and saved preferences." />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a class="brand" href="/index.html">AKANESHI</a>
      </nav>
    </header>

    <main class="page-shell auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
        <form id="login-form" novalidate>
          <input type="email" name="email" placeholder="Email address" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit" class="button full-width">Sign in</button>
        </form>
        <p class="auth-link">Need an account? <a href="/register.html">Create one</a></p>
      </section>
    </main>
  </body>
</html>
